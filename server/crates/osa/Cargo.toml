[package]
name = "osa"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "osa-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
base64 = "0.22"
bytes = "1"
chrono = "0.4.45"
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
futures = "0.3"
encoding_rs = "0.8"
fancy-regex = "0.14"
flate2 = "1"
indexmap = "2"
libc = "0.2"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
mime_guess = "2.0.5"
parking_lot = "0.12.5"
rand = "0.8"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "query", "rustls", "form", "multipart"] }
rmcp = { version = "3.11.0", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
hmac = "0.12"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["compression-br", "compression-gzip", "fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
